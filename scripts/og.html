<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 55% 55% at 80% 20%, rgba(40, 82, 130, 0.28), transparent 70%),
      radial-gradient(ellipse 40% 45% at 12% 85%, rgba(27, 58, 92, 0.22), transparent 70%),
      #05080e;
    color: #dce6f5;
    font-family: 'DM Sans', sans-serif;
    position: relative;
  }
  .frame {
    position: absolute; inset: 20px;
    border: 1px solid rgba(88, 174, 201, 0.18);
  }
  .stars { position: absolute; inset: 0; opacity: .7; }
  .moon {
    position: absolute; top: 84px; right: 104px;
    width: 196px; height: 196px; border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #eef4ff 0%, #b8cee9 28%, #6f96c2 58%, #1a2a4a 100%);
    box-shadow: 0 0 50px 16px rgba(127,168,212,.16), 0 0 110px 50px rgba(74,120,180,.09);
  }
  .moon-halo {
    position: absolute; top: 54px; right: 74px;
    width: 256px; height: 256px; border-radius: 50%;
    border: 1px solid rgba(127,168,212,.13);
  }
  .moon-ring {
    position: absolute; top: 22px; right: 42px;
    width: 320px; height: 320px; border-radius: 50%;
    border: 1px solid rgba(88,174,201,.08);
  }
  .dragon {
    position: absolute; left: -12px; bottom: 36px; width: 340px;
    color: #cfe0ff; opacity: .07;
  }
  .content { position: absolute; left: 72px; top: 66px; width: 760px; }
  .path {
    font-family: 'Space Mono', monospace;
    font-size: 12px; letter-spacing: .18em; color: #5d7395;
    margin-bottom: 34px;
  }
  .path b { color: #58aec9; font-weight: 400; }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 104px; font-weight: 300; line-height: .9;
    letter-spacing: -.025em; margin-bottom: 22px;
  }
  h1 em { font-style: italic; color: #82a9d6; }
  h1 i { font-style: normal; color: #c9a96e; }
  .headline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 34px; font-weight: 300; line-height: 1.25;
    color: #d3e0f4; max-width: 650px; margin-bottom: 26px;
  }
  .tags {
    font-family: 'Space Mono', monospace;
    font-size: 11px; letter-spacing: .14em; color: #8ba0bf;
  }
  .tags span { color: #58aec9; }
  .bottom {
    position: absolute; left: 72px; right: 72px; bottom: 44px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: .12em; color: #5d7395;
  }
  .bottom b { color: #7ee0b8; font-weight: 400; }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; opacity: .55; }
</style>
</head>
<body>
  <div class="frame"></div>
  <svg class="stars" viewBox="0 0 100 100" preserveAspectRatio="none">
    <g fill="#cfe0ff">
      <circle cx="8" cy="14" r=".22" opacity=".5"/><circle cx="17" cy="31" r=".18" opacity=".4"/>
      <circle cx="26" cy="9" r=".28" opacity=".6"/><circle cx="34" cy="22" r=".16" opacity=".3"/>
      <circle cx="41" cy="13" r=".2" opacity=".5"/><circle cx="49" cy="37" r=".24" opacity=".4"/>
      <circle cx="57" cy="8" r=".18" opacity=".5"/><circle cx="63" cy="25" r=".3" opacity=".6"/>
      <circle cx="71" cy="12" r=".16" opacity=".3"/><circle cx="78" cy="39" r=".2" opacity=".4"/>
      <circle cx="86" cy="17" r=".26" opacity=".5"/><circle cx="93" cy="33" r=".18" opacity=".4"/>
      <circle cx="12" cy="48" r=".2" opacity=".4"/><circle cx="22" cy="57" r=".16" opacity=".3"/>
      <circle cx="31" cy="43" r=".24" opacity=".5"/><circle cx="44" cy="52" r=".18" opacity=".3"/>
      <circle cx="54" cy="47" r=".2" opacity=".4"/><circle cx="67" cy="56" r=".16" opacity=".3"/>
      <circle cx="74" cy="44" r=".22" opacity=".4"/><circle cx="88" cy="52" r=".18" opacity=".3"/>
    </g>
  </svg>

  <div class="moon-ring"></div>
  <div class="moon-halo"></div>
  <div class="moon"></div>

  <svg class="dragon" viewBox="0 0 400 300" fill="none">
    <path d="M20,220 C60,180 80,120 140,100 C180,86 200,110 240,90 C280,70 300,40 340,30 C360,24 380,28 390,20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M140,100 C130,80 120,60 100,50 C90,45 80,50 75,60" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M240,90 C250,70 260,50 270,40" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M240,90 C255,100 265,115 260,130" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="95" cy="44" r="3.4" fill="currentColor" opacity=".7"/>
  </svg>

  <div class="content">
    <div class="path"><b>~</b> / matheesan.ca</div>
    <h1>Mathe<em>esan</em><i>.</i></h1>
    <div class="headline">Engineer by day.<br>DJ by night. Gamer in between.</div>
    <div class="tags">MUSIC · <span>GAMES</span> · AI SYSTEMS</div>
  </div>

  <svg class="wave" viewBox="0 0 1200 190" preserveAspectRatio="none">
    <path d="M0,120 C180,86 280,150 430,128 C580,106 650,58 800,82 C950,106 1030,150 1200,112" stroke="#1b3a5c" stroke-width="1.5" fill="none"/>
    <path d="M0,142 C160,112 300,168 460,146 C620,124 700,86 860,108 C1020,130 1090,160 1200,136" stroke="#4a9ebb" stroke-opacity=".26" stroke-width="1" fill="none"/>
    <path d="M0,162 C220,132 340,180 520,160 C700,140 820,112 1000,132 C1100,143 1160,156 1200,150" stroke="#1e4d7a" stroke-opacity=".5" stroke-width="1" fill="none"/>
  </svg>

  <div class="bottom">
    <span><b>TAMIL-CANADIAN</b> · DJ · GAMER</span>
    <span>43.8354° N · 79.0890° W</span>
  </div>
</body>
</html>
