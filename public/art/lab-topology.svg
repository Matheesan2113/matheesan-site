  </g>

  <line x1="54" y1="500" x2="1146" y2="500" stroke="#4fffd0" stroke-opacity=".2"/>
  <text x="56" y="532" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#4fffd0" letter-spacing="1.2" >POSTURE</text>
  <text x="56" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8ba0bf" letter-spacing="1.2" >capability without coordinates</text>
  <text x="56" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8ba0bf" letter-spacing="1.2" >accounts created by hand · no public signup</text>
  <text x="56" y="616" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8ba0bf" letter-spacing="1.2" >private services stay off the public DNS</text>
  <text x="744" y="532" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#c9a96e" letter-spacing="1.2" >PUBLIC SURFACE</text>
  <text x="744" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8ba0bf" letter-spacing="1.2" >minimal · monitored · no admin ports</text>
  <text x="744" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8ba0bf" letter-spacing="1.2" >least privilege · tested restores</text>
  <text x="1146" y="646" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5" fill="#4fffd0">SECURITY &gt; SPECIFICITY</text>
