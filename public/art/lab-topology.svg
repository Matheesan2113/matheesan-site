      <rect x="960" y="241" width="40" height="8" fill="#2b4a5e"/><text x="840" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#8ba0bf">addresses</text>
      <rect x="960" y="279" width="124" height="8" fill="#16283a"/>
      <rect x="960" y="279" width="67" height="8" fill="#2b4a5e"/><text x="840" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#8ba0bf">versions</text>
      <rect x="960" y="317" width="124" height="8" fill="#16283a"/>
      <rect x="960" y="317" width="94" height="8" fill="#2b4a5e"/><text x="840" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#8ba0bf">service map</text>
      <rect x="960" y="355" width="124" height="8" fill="#16283a"/>
      <rect x="960" y="355" width="43" height="8" fill="#2b4a5e"/><text x="840" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" fill="#8ba0bf">everything else</text>
      <rect x="960" y="393" width="124" height="8" fill="#16283a"/>
      <rect x="960" y="393" width="70" height="8" fill="#2b4a5e"/>
