<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#05080e"/>
      <stop offset="1" stop-color="#0a1526"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4fffd0" stop-opacity=".22"/>
      <stop offset="0.55" stop-color="#4fffd0" stop-opacity=".06"/>
      <stop offset="1" stop-color="#4fffd0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#58aec9" stroke-opacity=".07" stroke-width=".7"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".018"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4fffd0"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#c9a96e"/>
    </marker>
  </defs>
  
  <rect width="1200" height="700" fill="#05080e"/>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="20" y="20" width="1160" height="660" fill="none" stroke="#4fffd0" stroke-opacity=".3"/>
  <rect x="20" y="20" width="1160" height="660" fill="url(#scan)"/>
  <path d="M20 52V32H40M1180 52V32H1160M20 648V668H40M1180 648V668H1160" fill="none" stroke="#4fffd0" stroke-opacity=".8" stroke-width="1.2"/>
  <text x="44" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.2" fill="#4fffd0">HOMELAB / PUBLIC VIEW</text>
  <text x="1156" y="48" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.8" fill="#6b82a5">DETAILS WITHHELD</text>
  <circle cx="600" cy="340" r="300" fill="url(#halo)"/>
  <text x="54" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#dce6f5">A production lab, deliberately private.</text>
  <text x="56" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#6b82a5">CAPABILITIES SHOWN / HOSTS, ADDRESSES, VERSIONS AND THE SERVICE MAP WITHHELD</text>

  <text x="56" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.6" fill="#4fffd0">CAPABILITIES</text>
  <line x1="56" y1="178" x2="760" y2="178" stroke="#4fffd0" stroke-opacity=".2"/>
  
  <g>
    <rect x="56" y="190" width="340" height="96" fill="rgba(8,17,31,.86)" stroke="#4fffd0" stroke-opacity=".5"/>
    <path d="M56 200V190H68M384 190H396V200M56 276V286H68M384 286H396V276" fill="none" stroke="#4fffd0" stroke-opacity=".9"/>
    <text x="68" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#4fffd0">LOCAL COMPUTE</text>
    <text x="68" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing=".6" fill="#6b82a5">private inference · no cloud</text>
  </g>
  <g>
    <rect x="420" y="190" width="340" height="96" fill="rgba(8,17,31,.86)" stroke="#4fffd0" stroke-opacity=".5"/>
    <path d="M420 200V190H432M748 190H760V200M420 276V286H432M748 286H760V276" fill="none" stroke="#4fffd0" stroke-opacity=".9"/>
    <text x="432" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#4fffd0">PRIVATE SERVICES</text>
    <text x="432" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing=".6" fill="#6b82a5">single sign-on · accounts by hand</text>
  </g>
  <g>
    <rect x="56" y="306" width="340" height="96" fill="rgba(8,17,31,.86)" stroke="#7df9ff" stroke-opacity=".5"/>
    <path d="M56 316V306H68M384 306H396V316M56 392V402H68M384 402H396V392" fill="none" stroke="#7df9ff" stroke-opacity=".9"/>
    <text x="68" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#7df9ff">SEGMENTED NETWORK</text>
    <text x="68" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing=".6" fill="#6b82a5">least privilege · minimal surface</text>
  </g>
  <g>
    <rect x="420" y="306" width="340" height="96" fill="rgba(8,17,31,.86)" stroke="#c9a96e" stroke-opacity=".5"/>
    <path d="M420 316V306H432M748 306H760V316M420 392V402H432M748 402H760V392" fill="none" stroke="#c9a96e" stroke-opacity=".9"/>
    <text x="432" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#c9a96e">TESTED BACKUPS</text>
    <text x="432" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing=".6" fill="#6b82a5">restore, not assume</text>
  </g>

  <g>
    <rect x="820" y="160" width="324" height="300" fill="rgba(8,17,31,.88)" stroke="#c9a96e" stroke-opacity=".5"/>
    <path d="M820 170V160H832M1132 160H1144V170M820 450V460H832M1132 460H1144V450" fill="none" stroke="#c9a96e" stroke-opacity=".9"/>
    <text x="840" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#c9a96e">WITHHELD BY DESIGN</text>
